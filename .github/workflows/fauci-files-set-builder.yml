name: Fauci Files Card Set Builder

on:
  workflow_dispatch:
    inputs:
      publish_shopify:
        description: "After machine + human gates, allow Shopify draft creation"
        required: true
        type: boolean
        default: false
  push:
    branches: [build/fauci-files-card-set-v1]
    paths:
      - "sets/fauci-files/**"
      - "tools/build_fauci_cards.py"
      - ".github/workflows/fauci-files-set-builder.yml"

permissions:
  contents: read

concurrency:
  group: fauci-files-${{ github.ref }}
  cancel-in-progress: true

jobs:
  machine-render:
    name: AL render + deterministic replay
    runs-on: ubuntu-latest
    outputs:
      manifest_sha: ${{ steps.digest.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Render pass one
        run: python tools/build_fauci_cards.py
      - name: Freeze pass one
        run: cp -R rendered/fauci-files /tmp/fauci-pass-one
      - name: Render pass two
        run: |
          rm -rf rendered/fauci-files
          python tools/build_fauci_cards.py
          diff -ru /tmp/fauci-pass-one rendered/fauci-files
      - id: digest
        name: Record manifest digest
        run: echo "manifest_sha=$(sha256sum rendered/fauci-files/manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fauci-files-rendered-images
          path: rendered/fauci-files/
          if-no-files-found: error

  machine-law:
    name: ALMS evidence boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate machine input contract
        shell: python
        run: |
          import json, pathlib
          p=pathlib.Path("sets/fauci-files/set.json")
          d=json.loads(p.read_text())
          assert d["identity_anchor"] == "jaywisdom.base.eth"
          assert d["authority_created"] is False
          assert d["legal_equivalence"] == "DISPUTED"
          assert len(d["cards"]) == 6
          joined=" ".join(d["invariants"])
          for required in ("hash_match_is_not_trigger","letter_is_not_DOJ_action","civil_is_not_criminal"):
              assert required in joined
          assert next(c for c in d["cards"] if c["id"]=="FF-001")["state"]=="PASS_LETTERS_INVENTORY_ONLY"
          assert next(c for c in d["cards"] if c["id"]=="FF-004")["state"]=="HOLD"

  machine-shopify-input:
    name: Machine input → Shopify draft payload
    runs-on: ubuntu-latest
    needs: [machine-render, machine-law]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fauci-files-rendered-images
          path: rendered/fauci-files
      - name: Build Shopify handoff
        shell: python
        env:
          MANIFEST_SHA: ${{ needs.machine-render.outputs.manifest_sha }}
        run: |
          import json, os, pathlib
          spec=json.loads(pathlib.Path("sets/fauci-files/set.json").read_text())
          payload={
            "mode":"DRAFT_HANDOFF",
            "mission_owner":"Jason Wisdom",
            "identity_anchor":"jaywisdom.base.eth",
            "machine_gate":"PASS",
            "human_gate":"PENDING",
            "shopify_publish":"BLOCKED_PENDING_HUMAN",
            "render_manifest_sha256":os.environ["MANIFEST_SHA"],
            "products":[{
              "handle":"publicproof-"+c["id"].lower(),
              "title":c["name"],
              "status":"DRAFT",
              "description":c["caption"],
              "tags":["PublicProof","Fauci Files",c["lane"],c["state"]],
              "image_artifact":"rendered/fauci-files/"+c["id"]+".svg"
            } for c in spec["cards"]]
          }
          pathlib.Path("shopify").mkdir()
          pathlib.Path("shopify/FAUCI_FILES_SHOPIFY_HANDOFF.json").write_text(json.dumps(payload,indent=2)+"\n")
      - uses: actions/upload-artifact@v4
        with:
          name: fauci-files-shopify-draft-handoff
          path: shopify/FAUCI_FILES_SHOPIFY_HANDOFF.json
          if-no-files-found: error

  human-judgment:
    name: Human judgment
    runs-on: ubuntu-latest
    needs: [machine-render, machine-law, machine-shopify-input]
    environment: gpk-human-judgment
    steps:
      - run: |
          echo "Human reviewer approved the rendered-image set for Shopify handoff."
          echo "Approval is creative/publication judgment, not legal authority."

  shopify-output:
    name: Shopify output gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_shopify }}
    runs-on: ubuntu-latest
    needs: [human-judgment, machine-shopify-input]
    environment: shopify-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fauci-files-shopify-draft-handoff
          path: shopify
      - name: Require configured Shopify publisher
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: |
          test -n "$SHOPIFY_STORE_DOMAIN"
          test -n "$SHOPIFY_ADMIN_TOKEN"
          echo "Credentials present. Publication adapter is intentionally separate from evidence generation."
          echo "No legal authority is created by Shopify output."
      - uses: actions/upload-artifact@v4
        with:
          name: approved-shopify-output
          path: shopify/FAUCI_FILES_SHOPIFY_HANDOFF.json
