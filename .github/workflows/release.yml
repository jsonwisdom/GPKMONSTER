name: Canon Release

on:
  push:
    tags:
      - 'canon-v*'

permissions:
  contents: read

concurrency:
  group: canon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifests = [
              Path('docs/manifest.json'),
              Path('future-freakout/manifest.json'),
              Path('greek-dualism/manifest.json'),
              Path('parody-kidz/manifest.json'),
              Path('quarantine/manifest.json'),
              Path('inventory.json'),
          ]

          for path in manifests:
              data = json.loads(path.read_text())
              if data.get('release_ready') is not True:
                  raise SystemExit(f'{path}: release_ready must be true')
              if data.get('authority') is not False:
                  raise SystemExit(f'{path}: authority must remain false')

          print('RELEASE_STATE_VALID')
          PY

      - name: Create source archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='GPKMONSTER-canon-archive.zip'
          git archive --format=zip --output="$ARCHIVE" "$GITHUB_SHA"
          sha256sum "$ARCHIVE" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GPKMONSTER-canon-archive.zip
            SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
