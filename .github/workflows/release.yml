name: Canon Release

on:
  push:
    tags:
      - 'canon-v*'

permissions:
  contents: read

concurrency:
  group: canon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate manifests and build deterministic archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path('.')
          inventory_path = root / 'inventory.json'
          inventory = json.loads(inventory_path.read_text())

          if inventory.get('release_ready') is not True:
              raise SystemExit('inventory.json: release_ready must be true')
          if inventory.get('authority') is not False:
              raise SystemExit('inventory.json: authority must remain false')

          entries = inventory.get('files')
          if not isinstance(entries, list) or not entries:
              raise SystemExit('inventory.json: files must be a non-empty list')

          seen = set()
          inventory_paths = []

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          for entry in entries:
              rel = entry.get('path')
              expected = entry.get('sha256')
              expected_bytes = entry.get('bytes')

              if not isinstance(rel, str) or not rel:
                  raise SystemExit('inventory.json: every entry needs a path')

              posix = PurePosixPath(rel)
              if posix.is_absolute() or '..' in posix.parts:
                  raise SystemExit(f'inventory.json: unsafe path: {rel}')
              if rel in seen:
                  raise SystemExit(f'inventory.json: duplicate path: {rel}')
              seen.add(rel)

              path = root / rel
              if not path.is_file():
                  raise SystemExit(f'inventory.json: missing file: {rel}')

              actual = sha256(path)
              if actual != expected:
                  raise SystemExit(
                      f'inventory.json: hash mismatch for {rel}: '
                      f'expected {expected}, got {actual}'
                  )

              if path.stat().st_size != expected_bytes:
                  raise SystemExit(
                      f'inventory.json: size mismatch for {rel}: '
                      f'expected {expected_bytes}, got {path.stat().st_size}'
                  )

              inventory_paths.append(rel)

          manifest_paths = [
              'docs/manifest.json',
              'future-freakout/manifest.json',
              'greek-dualism/manifest.json',
              'parody-kidz/manifest.json',
              'quarantine/manifest.json',
          ]

          for manifest_rel in manifest_paths:
              manifest_path = root / manifest_rel
              if not manifest_path.is_file():
                  raise SystemExit(f'missing manifest: {manifest_rel}')

              data = json.loads(manifest_path.read_text())
              if data.get('release_ready') is not True:
                  raise SystemExit(f'{manifest_rel}: release_ready must be true')
              if data.get('authority') is not False:
                  raise SystemExit(f'{manifest_rel}: authority must remain false')

              folder = manifest_path.parent
              local_seen = set()
              for item in data.get('files', []):
                  name = item.get('file')
                  expected = item.get('sha256')
                  expected_bytes = item.get('bytes')
                  if not isinstance(name, str) or not name:
                      raise SystemExit(f'{manifest_rel}: invalid file entry')
                  if name in local_seen:
                      raise SystemExit(f'{manifest_rel}: duplicate file: {name}')
                  local_seen.add(name)

                  path = folder / name
                  if not path.is_file():
                      raise SystemExit(f'{manifest_rel}: missing file: {name}')
                  actual = sha256(path)
                  if actual != expected:
                      raise SystemExit(
                          f'{manifest_rel}: hash mismatch for {name}: '
                          f'expected {expected}, got {actual}'
                      )
                  if path.stat().st_size != expected_bytes:
                      raise SystemExit(
                          f'{manifest_rel}: size mismatch for {name}: '
                          f'expected {expected_bytes}, got {path.stat().st_size}'
                      )

              actual_files = {
                  p.name for p in folder.iterdir()
                  if p.is_file() and p.name != 'manifest.json'
              }
              if actual_files != local_seen:
                  missing = sorted(local_seen - actual_files)
                  extra = sorted(actual_files - local_seen)
                  raise SystemExit(
                      f'{manifest_rel}: manifest/file-set mismatch; '
                      f'missing={missing}, extra={extra}'
                  )

          archive = Path('GPKMONSTER-canon-archive.zip')
          archive_members = sorted(inventory_paths + ['inventory.json'])

          with zipfile.ZipFile(
              archive,
              'w',
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
          ) as zf:
              for rel in archive_members:
                  path = root / rel
                  info = zipfile.ZipInfo(rel, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (stat.S_IFREG | 0o644) << 16
                  info.create_system = 3
                  zf.writestr(info, path.read_bytes())

          with zipfile.ZipFile(archive, 'r') as zf:
              names = zf.namelist()
              if names != archive_members:
                  raise SystemExit('archive member set/order mismatch')
              if len(names) != len(set(names)):
                  raise SystemExit('archive contains duplicate paths')

          digest = sha256(archive)
          Path('SHA256SUMS.txt').write_text(
              f'{digest}  {archive.name}\n'
          )

          print('MANIFEST_REPLAY_VALID')
          print(f'ARCHIVE_SHA256={digest}')
          PY

          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            GPKMONSTER-canon-archive.zip
            SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
